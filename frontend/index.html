
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Score Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Mental Health Score Predictor</h1>
        <p>Understand your digital habits and lifestyle.</p>
    </header>

    <main>

        <form id="prediction-form">

            <h2>Personal Information</h2>

            <label>Age</label>
            <input type="number" name="Age" min="18" max="24" required>

            <label>Gender</label>
            <select name="Gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Country</label>
            <input type="text" name="Country"
                   placeholder="Enter your country" required>

            <label>Academic Level</label>
            <select name="Academic_Level" required>
                <option value="">Select Academic Level</option>
                <option value="High School">High School</option>
                <option value="Undergraduate">Undergraduate</option>
                <option value="Graduate">Graduate</option>
            </select>

            <h2>Digital Habits</h2>

            <label>Most Used Platform</label>
            <select name="Most_Used_Platform" required>
                <option value="">Select Platform</option>
                <option value="Facebook">Facebook</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Instagram">Instagram</option>
                <option value="Snapchat">Snapchat</option>
                <option value="Twitter">Twitter</option>
                <option value="YouTube">YouTube</option>
                <option value="TikTok">TikTok</option>
                <option value="LINE">LINE</option>
                <option value="KakaoTalk">KakaoTalk</option>
                <option value="VKontakte">VKontakte</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="WeChat">WeChat</option>
            </select>

            <label>Purpose of Use</label>
            <select name="Purpose_Of_Use" required>
                <option value="">Select Purpose</option>
                <option value="Networking">Networking</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="News">News</option>
            </select>

            <label>Average Daily Usage Hours</label>
            <input type="number" name="Avg_Daily_Usage_Hours"
                   min="0" step="any" required>

            <label>Daily Unlocks</label>
            <input type="number" name="Daily_Unlocks"
                   min="0" step="1" required>

            <h2>Lifestyle</h2>

            <label>Study Hours</label>
            <input type="number" name="Study_Hours"
                   min="0" step="any" required>

            <label>Physical Activity Hours</label>
            <input type="number" name="Physical_Activity_Hours"
                   step="any" required>

            <label>Sleep Hours Per Night</label>
            <input type="number" name="Sleep_Hours_Per_Night"
                   min="0" step="any" required>

            <label>Stress Level</label>
            <select name="Stress_Level" required>
                <option value="">Select Stress Level</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Very High">Very High</option>
            </select>

            <button type="submit">Predict Score</button>

        </form>

        <section id="result">
            <h2>Your Prediction</h2>
            <p id="prediction-output">
                Complete the form to get your prediction.
            </p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
